services:
  - type: web
    name: dance7-api
    runtime: java
    plan: starter
    rootDir: backend
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/*.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
