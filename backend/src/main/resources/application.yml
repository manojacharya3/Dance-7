spring:
  application:
    name: dance7-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studioos}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres123}
    hikari:
      # Fail fast on an unreachable (e.g. cold) database so the chat flow can
      # degrade to its graceful fallback instead of hanging into a gateway 502.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  security:
    jwt-secret: ${JWT_SECRET:ZGFuY2U3LWRldmVsb3BtZW50LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0zMmJ5dGVz}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    cookie-secure: ${COOKIE_SECURE:false}
    debug-user-enabled: ${DEBUG_USER_ENABLED:false}

dance7:
  ai:
    # Optional external LLM (OpenAI-compatible). enabled=false (default) keeps the
    # deterministic rule-based provider serving traffic. Never commit a real key here.
    enabled: ${DANCE7_AI_ENABLED:false}
    llm-url: ${DANCE7_AI_LLM_URL:https://api.openai.com/v1}
    api-key: ${DANCE7_AI_API_KEY:}
    model: ${DANCE7_AI_MODEL:gpt-4o-mini}
    connect-timeout-ms: ${DANCE7_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${DANCE7_AI_READ_TIMEOUT_MS:15000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Local diagnostics only. Override these levels or remove this block in production.
logging:
  level:
    org.springframework.security.web.FilterChainProxy: TRACE
    org.springframework.security.authentication: TRACE
    org.springframework.security.authorization: TRACE
    org.springframework.security.web.csrf: TRACE
